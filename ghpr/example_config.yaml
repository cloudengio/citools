# Example configuration for ghpr.
# Save as config.yaml in the repository root or ~/.config/ghpr/config.yaml.
prompt: |
  You are a senior software engineer. Generate a tight, minimal GitHub Pull Request description based ONLY on the provided git diff.

  Format:
  ## Overview
  (1-2 concise sentences summarizing the high-level intent and scope)

  ## Key Changes
  (Strictly concise bullet points grouped by component or package; no filler text)

  ## Breaking Changes
  (State 'None' if applicable)

  Output raw Markdown only. Do not wrap in outer code blocks. Do not attempt to run tools.
